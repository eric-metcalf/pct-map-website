<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dori's PCT Journey</title>

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Reset and Base Styles */
        body, h1, h2, h3, h4, h5, h6, p, blockquote, pre, hr, dl, dd, ol, ul, figure {
            margin: 0;
            padding: 0;
        }

        body {
            font: 400 16px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #111;
            background-color: #fdfdfd;
            -webkit-text-size-adjust: 100%;
        }

        html {
            scroll-behavior: smooth;
        }

        * {
            box-sizing: border-box;
        }

        /* Header */
        .site-header {
            border-top: 5px solid #038285;
            border-bottom: 1px solid #e8e8e8;
            min-height: 56px;
            background-color: #fff;
            position: relative;
        }

        .wrapper {
            max-width: calc(800px - (30px * 2));
            margin-right: auto;
            margin-left: auto;
            padding-right: 30px;
            padding-left: 30px;
        }

        .site-header .wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 56px;
        }

        .site-title {
            font-size: 26px;
            font-weight: 300;
            line-height: 56px;
            letter-spacing: -1px;
            margin-bottom: 0;
            color: #038285;
            text-decoration: none;
        }

        .site-title:hover {
            text-decoration: none;
            color: #026668;
        }

        .site-nav {
            line-height: 56px;
        }

        .site-nav .page-link {
            color: #1D1D1B;
            line-height: 1.5;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-left: 5px;
        }

        .site-nav .page-link:hover {
            background-color: #e6f7f7;
            color: #038285;
        }

        /* Page Content */
        .page-content {
            padding: 60px 0;
        }

        .section {
            margin-bottom: 60px;
        }

        h1 {
            font-size: 42px;
            font-weight: 300;
            margin-bottom: 20px;
            color: #111;
        }

        h2 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 15px;
            color: #1D1D1B;
        }

        p {
            margin-bottom: 15px;
            line-height: 1.7;
            color: #555;
        }

        a {
            color: #038285;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #026668;
            text-decoration: underline;
        }

        /* Markdown Content Styles */
        #markdown-content {
            max-width: 800px;
            margin: 0 auto;
        }

        #markdown-content h1 {
            font-size: 42px;
            font-weight: 300;
            margin-bottom: 20px;
            color: #111;
            text-align: center;
        }

        #markdown-content h2 {
            font-size: 28px;
            font-weight: 400;
            margin-top: 40px;
            margin-bottom: 15px;
            color: #1D1D1B;
        }

        #markdown-content h3 {
            font-size: 22px;
            font-weight: 400;
            margin-top: 30px;
            margin-bottom: 10px;
            color: #038285;
        }

        #markdown-content p {
            margin-bottom: 15px;
            line-height: 1.7;
            color: #555;
            font-size: 16px;
        }

        #markdown-content strong {
            color: #1D1D1B;
            font-weight: 600;
        }

        #markdown-content hr {
            border: none;
            border-top: 1px solid #e8e8e8;
            margin: 40px 0;
        }

        #markdown-content ul, #markdown-content ol {
            margin-bottom: 20px;
            padding-left: 30px;
            color: #555;
        }

        #markdown-content li {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        #markdown-content a {
            color: #038285;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border: 1px solid #038285;
            border-radius: 4px;
            display: inline-block;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        #markdown-content a:hover {
            background-color: #038285;
            color: white;
            text-decoration: none;
        }

        #markdown-content em {
            color: #999;
            font-style: italic;
        }

        /* Journey Cards */
        .journey-intro {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .journey-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .journey-card {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            overflow: hidden;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            text-decoration: none;
            color: #333;
            display: block;
        }

        .journey-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
            text-decoration: none;
        }

        .journey-card-content {
            padding: 30px;
        }

        .journey-card h2 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 10px;
            color: #038285;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .journey-card .icon {
            font-size: 28px;
        }

        .journey-card p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin: 0;
        }

        /* Footer */
        .site-footer {
            border-top: 1px solid #e8e8e8;
            padding: 30px 0;
            background-color: #f9f9f9;
            margin-top: 60px;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-left p {
            font-size: 14px;
            color: #828282;
            margin: 0;
        }

        /* Responsive */
        @media screen and (max-width: 800px) {
            .wrapper {
                max-width: calc(800px - 30px);
                padding-right: 15px;
                padding-left: 15px;
            }

            .journey-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 32px;
            }
        }

        @media screen and (max-width: 600px) {
            .site-header .wrapper {
                flex-direction: column;
                align-items: flex-start;
            }

            .site-nav {
                line-height: normal;
                padding-bottom: 10px;
            }

            .site-nav .page-link {
                margin-left: 0;
                margin-right: 10px;
            }

            .footer-content {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Header/Navigation -->
    <header class="site-header">
        <div class="wrapper">
            <a class="site-title" href="index.html">Dori's PCT Journey</a>
            <nav class="site-nav">
                <a class="page-link" href="index.html">Home</a>
                <a class="page-link" href="map.html">Map</a>
                <a class="page-link" href="photography.html">Photography</a>
                <a class="page-link" href="daily_breakdown.html">Daily Breakdown</a>
            </nav>
        </div>
    </header>

    <!-- Page Content -->
    <div class="page-content">
        <div class="wrapper">
            <!-- Journey Section - Content loaded from markdown -->
            <section class="section">
                <div id="markdown-content">
                    <p style="text-align: center; color: #038285;">Loading content...</p>
                </div>
            </section>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="wrapper">
            <div class="footer-content">
                <div class="footer-left">
                    <p>Pacific Crest Trail • Mexico to Canada • 2,650 Miles</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Load and render markdown content
        fetch('content/home.md')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load content');
                }
                return response.text();
            })
            .then(markdown => {
                // Parse markdown to HTML
                const html = marked.parse(markdown);
                document.getElementById('markdown-content').innerHTML = html;
            })
            .catch(error => {
                console.error('Error loading markdown:', error);
                document.getElementById('markdown-content').innerHTML = `
                    <h1>Welcome to Dori's PCT Journey</h1>
                    <p style="color: #e74c3c;">Error loading content. Please refresh the page.</p>
                `;
            });
    </script>
</body>
</html>
