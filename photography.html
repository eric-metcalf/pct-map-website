<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - Dori's PCT Journey</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #000;
            overflow: hidden;
        }
        
        /* Header matching home page */
        .site-header {
            border-top: 5px solid #038285;
            border-bottom: 1px solid #e8e8e8;
            min-height: 56px;
            background-color: #fff;
            position: relative;
            z-index: 1000;
        }

        .wrapper {
            max-width: calc(800px - (30px * 2));
            margin-right: auto;
            margin-left: auto;
            padding-right: 30px;
            padding-left: 30px;
        }

        .site-header .wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 56px;
        }

        .site-title {
            font-size: 26px;
            font-weight: 300;
            line-height: 56px;
            letter-spacing: -1px;
            margin-bottom: 0;
            color: #038285;
            text-decoration: none;
        }

        .site-title:hover {
            text-decoration: none;
            color: #026668;
        }

        .site-nav {
            line-height: 56px;
        }

        .site-nav .page-link {
            color: #1D1D1B;
            line-height: 1.5;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-left: 5px;
        }

        .site-nav .page-link:hover {
            background-color: #e6f7f7;
            color: #038285;
        }

        /* Slideshow styles */
        .slideshow-container {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100vh - 56px);
            background: #000;
        }

        .slideshow-photo-panel {
            flex: 1;
            min-width: 20%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #single-photo-view {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .slideshow-photo-panel img {
            max-width: 90%;
            max-height: 70%;
            object-fit: contain;
            border-radius: 8px;
        }

        /* Day view styles */
        #day-photo-grid {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
        }

        .day-view-header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #038285;
        }

        .day-view-header h2 {
            color: #038285;
            font-size: 1.8rem;
            margin: 10px 0;
        }

        .day-view-header p {
            font-style: italic;
            color: #e8e8e8;
            font-size: 1.1rem;
            margin: 10px auto;
            max-width: 600px;
            line-height: 1.5;
        }

        #day-photo-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            padding: 10px;
        }

        .day-photo-item {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            background: #2a2a2a;
        }

        .day-photo-item:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(3, 130, 133, 0.5);
        }

        .day-photo-item.selected {
            border: 3px solid #f39c12;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.7);
        }

        .day-photo-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .day-photo-item .photo-time {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px;
            font-size: 0.85rem;
            text-align: center;
        }

        .slideshow-divider {
            width: 4px;
            background: #038285;
            cursor: col-resize;
            position: relative;
            flex-shrink: 0;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slideshow-divider:hover {
            background: #05a8ab;
        }

        .slideshow-divider::before {
            content: '';
            position: absolute;
            left: -4px;
            right: -4px;
            top: 0;
            bottom: 0;
        }

        .slideshow-divider::after {
            content: '⋮';
            position: absolute;
            color: #fff;
            font-size: 20px;
            line-height: 1;
            pointer-events: none;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
        }

        .slideshow-info {
            color: white;
            padding: 20px;
            text-align: center;
            max-width: 90%;
        }

        .slideshow-info h2 {
            margin: 10px 0;
            font-size: 1.5rem;
        }

        .slideshow-info p {
            margin: 8px 0;
            font-size: 1rem;
            color: #ccc;
        }

        #slideshow-day-info {
            font-weight: bold;
            color: #038285 !important;
            font-size: 1.3rem !important;
            font-weight: bold !important;
            margin-top: 15px !important;
            margin-bottom: 10px !important;
        }

        #slideshow-message {
            font-style: italic;
            color: #e8e8e8 !important;
            font-size: 1.15rem !important;
            max-width: 700px;
            margin: 10px auto !important;
            line-height: 1.5;
            font-weight: 300;
        }

        .slideshow-map-panel {
            flex: 1;
            min-width: 20%;
            height: 100%;
            position: relative;
        }

        #slideshow-map {
            width: 100%;
            height: 100%;
        }

        .slideshow-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 2001;
        }

        .slideshow-btn {
            background: rgba(3, 130, 133, 0.9);
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            color: white;
        }

        .slideshow-btn:hover {
            background: #038285;
            transform: scale(1.05);
        }

        .slideshow-btn.close {
            background: rgba(29, 29, 27, 0.9);
            color: white;
        }

        .slideshow-btn.close:hover {
            background: #1D1D1B;
        }

        .day-view-toggle {
            position: fixed;
            top: 70px;
            left: 20px;
            z-index: 3000;
            display: flex;
            gap: 10px;
        }

        .slideshow-progress {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 6px;
            z-index: 2001;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 2000;
            font-size: 1.1rem;
            color: #038285;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Header matching home page -->
    <header class="site-header">
        <div class="wrapper">
            <a class="site-title" href="index.html">Dori's PCT Journey</a>
            <nav class="site-nav">
                <a class="page-link" href="index.html">Home</a>
                <a class="page-link" href="map.html">Map</a>
                <a class="page-link" href="photography.html">Photography</a>
                <a class="page-link" href="daily_breakdown.html">Daily Breakdown</a>
            </nav>
        </div>
    </header>
    
    <!-- Day View Toggle and Autoplay Buttons (Top Left of Page) -->
    <div class="day-view-toggle">
        <button class="slideshow-btn" id="toggle-view-btn">📅 Day View</button>
        <button class="slideshow-btn" id="top-play-pause-btn">▶ Play</button>
    </div>

    <!-- Slideshow Container -->
    <div class="slideshow-container">
        <div class="slideshow-photo-panel">
            <!-- Single photo view -->
            <div id="single-photo-view">
                <img id="slideshow-photo" src="" alt="PCT Photo">
                <div class="slideshow-info">
                    <h2 id="slideshow-filename"></h2>
                    <p id="slideshow-date"></p>
                    <p id="slideshow-location"></p>
                    <p id="slideshow-day-info"></p>
                    <p id="slideshow-message"></p>
                </div>
            </div>

            <!-- Day view grid -->
            <div id="day-photo-grid" style="display: none;">
                <div class="day-view-header">
                    <h2 id="day-view-title"></h2>
                    <p id="day-view-message"></p>
                </div>
                <div id="day-photo-grid-container"></div>
            </div>
        </div>

        <div class="slideshow-divider" id="slideshow-divider"></div>

        <div class="slideshow-map-panel">
            <div id="slideshow-map"></div>
            <div class="slideshow-progress">
                <span id="slideshow-current">1</span> / <span id="slideshow-total">0</span>
            </div>
            <div class="slideshow-controls">
                <button class="slideshow-btn" id="prev-btn">⏮ Previous</button>
                <button class="slideshow-btn" id="next-btn">Next ⏭</button>
                <button class="slideshow-btn close" id="close-slideshow-btn">✕ Close</button>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">Loading photos...</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet GPX Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        // Slideshow functionality
        let slideshowPhotos = [];
        let slideshowDailyLocations = [];
        let currentSlideIndex = 0;
        let slideshowMap = null;
        let slideshowMarker = null;
        let slideshowCampingMarkers = [];
        let slideshowCampingMarkersMap = new Map();
        let slideshowInterval = null;
        let isPlaying = false;
        let isDayView = false;
        let currentDayNumber = 1;
        let dayPhotoMarkers = [];
        let pctTrail = null;

        // Draggable divider functionality
        const divider = document.getElementById('slideshow-divider');
        const photoPanel = document.querySelector('.slideshow-photo-panel');
        const mapPanel = document.querySelector('.slideshow-map-panel');
        const container = document.querySelector('.slideshow-container');

        let isDragging = false;

        divider.addEventListener('mousedown', (e) => {
            isDragging = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const containerRect = container.getBoundingClientRect();
            const offsetX = e.clientX - containerRect.left;
            const percentage = (offsetX / containerRect.width) * 100;

            // Limit the resize to between 20% and 80%
            if (percentage >= 20 && percentage <= 80) {
                photoPanel.style.flex = `0 0 ${percentage}%`;
                mapPanel.style.flex = `0 0 ${100 - percentage}%`;

                // Trigger map resize
                if (slideshowMap) {
                    setTimeout(() => slideshowMap.invalidateSize(), 100);
                }
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        });

        // Helper function to calculate distance between two coordinates
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Get the journey day for a photo based on its date
        function getJourneyDay(photoDate) {
            if (slideshowPhotos.length === 0) return null;

            // Get the first photo's date as the start of the journey
            const startDate = new Date(slideshowPhotos[0].dateTaken);
            startDate.setHours(0, 0, 0, 0); // Reset to start of day

            const currentDate = new Date(photoDate);
            currentDate.setHours(0, 0, 0, 0); // Reset to start of day

            // Calculate day difference
            const diffTime = currentDate - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            return diffDays + 1; // Day 1, Day 2, etc.
        }

        // Get photo count for current day
        function getPhotoCountForDay(currentIndex) {
            const currentPhoto = slideshowPhotos[currentIndex];
            const currentDay = getJourneyDay(currentPhoto.dateTaken);

            let dayStart = currentIndex;
            let dayEnd = currentIndex;

            // Find start of day
            while (dayStart > 0 && getJourneyDay(slideshowPhotos[dayStart - 1].dateTaken) === currentDay) {
                dayStart--;
            }

            // Find end of day
            while (dayEnd < slideshowPhotos.length - 1 && getJourneyDay(slideshowPhotos[dayEnd + 1].dateTaken) === currentDay) {
                dayEnd++;
            }

            const photoNumInDay = currentIndex - dayStart + 1;
            const totalPhotosInDay = dayEnd - dayStart + 1;

            return { day: currentDay, photoNum: photoNumInDay, totalInDay: totalPhotosInDay };
        }

        // Find camping location by day number
        function findCampingByDay(dayNumber) {
            if (slideshowDailyLocations.length === 0) return null;

            return slideshowDailyLocations.find(location => location.day === dayNumber);
        }

        // Find closest camping location by day number difference
        function findClosestCampingByDay(photoDay) {
            if (slideshowDailyLocations.length === 0) return null;

            let closestCamping = null;
            let minDayDiff = Infinity;

            slideshowDailyLocations.forEach(location => {
                const dayDiff = Math.abs(location.day - photoDay);
                if (dayDiff < minDayDiff) {
                    minDayDiff = dayDiff;
                    closestCamping = location;
                }
            });

            return closestCamping;
        }

        // Get all photos for a specific day
        function getPhotosForDay(dayNumber) {
            return slideshowPhotos.filter(photo => {
                const photoDay = getJourneyDay(photo.dateTaken);
                return photoDay === dayNumber;
            });
        }

        // Get total number of days in the journey
        function getTotalDays() {
            if (slideshowPhotos.length === 0) return 0;
            const lastPhoto = slideshowPhotos[slideshowPhotos.length - 1];
            return getJourneyDay(lastPhoto.dateTaken);
        }

        // Toggle between single photo view and day view
        function toggleView() {
            isDayView = !isDayView;
            const toggleBtn = document.getElementById('toggle-view-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const topPlayPauseBtn = document.getElementById('top-play-pause-btn');

            if (isDayView) {
                // Switch to day view
                toggleBtn.textContent = '📷 Photo View';
                prevBtn.textContent = '⏮ Previous Day';
                nextBtn.textContent = 'Next Day ⏭';
                topPlayPauseBtn.style.display = 'none'; // Hide top play/pause in day view

                // Get current photo's day
                const currentPhoto = slideshowPhotos[currentSlideIndex];
                currentDayNumber = getJourneyDay(currentPhoto.dateTaken);

                showDayView(currentDayNumber);
            } else {
                // Switch to single photo view
                toggleBtn.textContent = '📅 Day View';
                prevBtn.textContent = '⏮ Previous';
                nextBtn.textContent = 'Next ⏭';
                topPlayPauseBtn.style.display = '';

                // Jump to first photo of the current day
                const dayPhotos = slideshowPhotos.filter(photo => {
                    return getJourneyDay(photo.dateTaken) === currentDayNumber;
                });

                if (dayPhotos.length > 0) {
                    // Find the index of the first photo of this day in the full slideshow
                    const firstPhotoOfDay = dayPhotos[0];
                    const indexInSlideshow = slideshowPhotos.findIndex(photo =>
                        photo.fileName === firstPhotoOfDay.fileName
                    );
                    if (indexInSlideshow !== -1) {
                        currentSlideIndex = indexInSlideshow;
                    }
                }

                showSlide(currentSlideIndex);
            }
        }

        // Find nearest camping locations to the north and south of a photo
        function findNearestCampingLocations(photoLat, photoLon) {
            if (slideshowDailyLocations.length === 0) return { north: null, south: null };

            let nearestNorth = null;
            let nearestSouth = null;
            let minDistanceNorth = Infinity;
            let minDistanceSouth = Infinity;

            slideshowDailyLocations.forEach(location => {
                const distance = calculateDistance(photoLat, photoLon, location.latitude, location.longitude);

                if (location.latitude > photoLat) {
                    if (distance < minDistanceNorth) {
                        minDistanceNorth = distance;
                        nearestNorth = location;
                    }
                } else if (location.latitude < photoLat) {
                    if (distance < minDistanceSouth) {
                        minDistanceSouth = distance;
                        nearestSouth = location;
                    }
                }
            });

            return { north: nearestNorth, south: nearestSouth };
        }

        // Parse CSV data
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',');
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const row = {};
                headers.forEach((header, index) => {
                    row[header.trim()] = values[index] ? values[index].trim() : '';
                });
                data.push(row);
            }

            return data;
        }

        // Load all data before initializing slideshow
        Promise.all([
            // Load PCT trail data
            fetch('pct_trail.json')
                .then(response => response.json())
                .then(coordinates => {
                    console.log(`Loaded ${coordinates.length} PCT trail points`);
                    pctTrail = L.polyline(coordinates, {
                        color: '#e74c3c',
                        weight: 4,
                        opacity: 0.8,
                        smoothFactor: 1,
                        pane: 'overlayPane'
                    });
                    console.log('PCT trail polyline created');
                })
                .catch(error => console.error('Error loading PCT trail:', error)),

            // Load daily locations
            fetch('inputs/map_overlay_metadata/daily_locations.json')
                .then(response => response.json())
                .then(data => {
                    slideshowDailyLocations = data;
                    console.log('Daily locations loaded:', data.length);
                })
                .catch(error => console.error('Error loading daily locations:', error)),

            // Load photo metadata
            fetch('inputs/map_overlay_metadata/image_metadata.csv')
                .then(response => response.text())
                .then(csvText => {
                    slideshowPhotos = parseCSV(csvText);

                    // Sort photos by timestamp (dateTaken)
                    slideshowPhotos.sort((a, b) => {
                        const dateA = new Date(a.dateTaken);
                        const dateB = new Date(b.dateTaken);
                        return dateA - dateB; // Ascending order (earliest first)
                    });

                    document.getElementById('slideshow-total').textContent = slideshowPhotos.length;
                    console.log('Photos loaded and sorted by timestamp:', slideshowPhotos.length);
                })
                .catch(error => {
                    console.error('Error loading photo metadata:', error);
                    throw error;
                })
        ]).then(() => {
            // All data loaded, initialize slideshow
            document.getElementById('loading').classList.add('hidden');
            initializeSlideshow();
        }).catch(error => {
            console.error('Error loading data:', error);
            document.getElementById('loading').textContent = 'Error loading data';
        });

        // Initialize slideshow
        function initializeSlideshow() {
            // Initialize slideshow map
            if (!slideshowMap) {
                slideshowMap = L.map('slideshow-map').setView([40.0, -120.0], 6);
                L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                    maxZoom: 17,
                    attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'
                }).addTo(slideshowMap);

                // Create a custom pane for photo markers to ensure they're on top
                slideshowMap.createPane('photoPane');
                slideshowMap.getPane('photoPane').style.zIndex = 650; // Higher than overlayPane (400) and markerPane (600)

                // Add PCT trail to slideshow map if available
                if (pctTrail) {
                    pctTrail.addTo(slideshowMap);
                }

                // Add camping location markers to slideshow map
                slideshowDailyLocations.forEach(location => {
                    const marker = L.circleMarker([location.latitude, location.longitude], {
                        radius: 6,
                        fillColor: '#27ae60',
                        color: '#fff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(slideshowMap);

                    const popupContent = `
                        <div style="min-width: 250px;">
                            <h3 style="margin: 0 0 10px 0; color: #27ae60;">Day ${location.day}</h3>
                            <p style="margin: 5px 0;"><strong>Date:</strong> ${location.date}</p>
                            <p style="margin: 10px 0; font-style: italic; color: #555; border-left: 3px solid #f39c12; padding-left: 10px;">${location.message}</p>
                            <p style="margin: 5px 0;"><strong>Coordinates:</strong> ${location.latitude.toFixed(5)}, ${location.longitude.toFixed(5)}</p>
                            <p style="margin: 5px 0;"><strong>Altitude:</strong> ${location.altitude} ft</p>
                        </div>
                    `;

                    marker.bindPopup(popupContent, {
                        maxWidth: 350,
                        minWidth: 250,
                        autoClose: false,
                        closeOnClick: false
                    });
                    slideshowCampingMarkers.push(marker);
                    slideshowCampingMarkersMap.set(location.day, marker);
                });
            }

            // Force map to render properly
            setTimeout(() => {
                if (slideshowMap) {
                    slideshowMap.invalidateSize();
                }
            }, 100);

            currentSlideIndex = 0;
            showSlide(currentSlideIndex);
            startAutoPlay();
        }

        function showSlide(index) {
            if (slideshowPhotos.length === 0) return;

            // Show single photo view, hide day view
            document.getElementById('single-photo-view').style.display = 'flex';
            document.getElementById('day-photo-grid').style.display = 'none';

            // Wrap around
            if (index >= slideshowPhotos.length) {
                currentSlideIndex = 0;
            } else if (index < 0) {
                currentSlideIndex = slideshowPhotos.length - 1;
            } else {
                currentSlideIndex = index;
            }

            const photo = slideshowPhotos[currentSlideIndex];
            const lat = parseFloat(photo.latitude);
            const lon = parseFloat(photo.longitude);

            // Get day information
            const dayInfo = getPhotoCountForDay(currentSlideIndex);

            // Update photo
            document.getElementById('slideshow-photo').src = `inputs/imagesFromPCT/${photo.fileName}`;

            // Hide filename - we'll show the day message instead
            document.getElementById('slideshow-filename').style.display = 'none';

            // Format date with day information
            const photoDate = new Date(photo.dateTaken);
            const dateStr = photoDate.toLocaleString();
            document.getElementById('slideshow-date').textContent = `${dateStr} (Day ${dayInfo.day}, Photo ${dayInfo.photoNum}/${dayInfo.totalInDay})`;

            document.getElementById('slideshow-location').textContent = `Location: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
            document.getElementById('slideshow-current').textContent = currentSlideIndex + 1;

            // Find camping location for this photo's day
            const dayCamping = findCampingByDay(dayInfo.day);

            // Find camping locations for current day and previous day
            const currentDayCamping = findCampingByDay(dayInfo.day);
            const previousDayCamping = findCampingByDay(dayInfo.day - 1);

            // Update day info and message - show the message for the photo's day
            if (dayCamping) {
                document.getElementById('slideshow-day-info').textContent = `Day ${dayCamping.day}`;
                document.getElementById('slideshow-message').textContent = dayCamping.message;
            } else {
                document.getElementById('slideshow-day-info').textContent = `Day ${dayInfo.day}`;
                document.getElementById('slideshow-message').textContent = '';
            }

            // Update map
            if (slideshowMap) {
                // Close all popups first
                slideshowCampingMarkers.forEach(marker => {
                    marker.closePopup();
                });

                // Remove day photo markers if switching from day view
                dayPhotoMarkers.forEach(marker => {
                    slideshowMap.removeLayer(marker);
                });
                dayPhotoMarkers = [];

                // Remove old GPX layer if exists
                if (dayGPXLayer) {
                    slideshowMap.removeLayer(dayGPXLayer);
                    dayGPXLayer = null;
                }

                // Calculate bounds to show photo and camping locations for current and previous day
                const boundsPoints = [[lat, lon]];
                if (currentDayCamping) {
                    boundsPoints.push([currentDayCamping.latitude, currentDayCamping.longitude]);
                }
                if (previousDayCamping) {
                    boundsPoints.push([previousDayCamping.latitude, previousDayCamping.longitude]);
                }

                // Load GPX track for this day
                loadGPXForDay(dayInfo.day, boundsPoints);

                if (boundsPoints.length > 1) {
                    const bounds = L.latLngBounds(boundsPoints);
                    slideshowMap.fitBounds(bounds, {
                        padding: [100, 100],
                        maxZoom: 14
                    });
                } else {
                    slideshowMap.setView([lat, lon], 15);
                }

                // Remove old photo marker
                if (slideshowMarker) {
                    slideshowMap.removeLayer(slideshowMarker);
                }

                // Add new photo marker
                slideshowMarker = L.circleMarker([lat, lon], {
                    radius: 10,
                    fillColor: '#f39c12',
                    color: '#fff',
                    weight: 3,
                    opacity: 1,
                    fillOpacity: 0.9,
                    pane: 'photoPane'
                }).addTo(slideshowMap);

                // Don't auto-open popup - user can click on camping marker to see details
                // The message is already displayed on the image panel

                // Force map to refresh
                setTimeout(() => {
                    slideshowMap.invalidateSize();
                }, 100);
            }
        }

        // Show day view with all photos from a specific day
        function showDayView(dayNumber) {
            currentDayNumber = dayNumber;

            // Hide single photo view, show day view
            document.getElementById('single-photo-view').style.display = 'none';
            document.getElementById('day-photo-grid').style.display = 'flex';

            // Get all photos for this day
            const dayPhotos = getPhotosForDay(dayNumber);

            // Get camping info for this day
            const dayCamping = findCampingByDay(dayNumber);

            // Update header
            document.getElementById('day-view-title').textContent = `Day ${dayNumber} (${dayPhotos.length} photos)`;
            if (dayCamping) {
                document.getElementById('day-view-message').textContent = dayCamping.message;
            } else {
                document.getElementById('day-view-message').textContent = '';
            }

            // Clear and populate photo grid
            const gridContainer = document.getElementById('day-photo-grid-container');
            gridContainer.innerHTML = '';

            dayPhotos.forEach((photo, index) => {
                const photoDiv = document.createElement('div');
                photoDiv.className = 'day-photo-item';
                photoDiv.dataset.photoIndex = slideshowPhotos.indexOf(photo);

                const img = document.createElement('img');
                img.src = `inputs/imagesFromPCT/${photo.fileName}`;
                img.alt = `Photo ${index + 1}`;

                const timeDiv = document.createElement('div');
                timeDiv.className = 'photo-time';
                const photoDate = new Date(photo.dateTaken);
                timeDiv.textContent = photoDate.toLocaleTimeString();

                photoDiv.appendChild(img);
                photoDiv.appendChild(timeDiv);

                // Click handler to select photo
                photoDiv.addEventListener('click', () => {
                    // Remove previous selection
                    document.querySelectorAll('.day-photo-item').forEach(item => {
                        item.classList.remove('selected');
                    });
                    photoDiv.classList.add('selected');

                    // Update map to show this photo's location
                    const photoIndex = parseInt(photoDiv.dataset.photoIndex);
                    updateMapForPhoto(photoIndex);
                });

                gridContainer.appendChild(photoDiv);
            });

            // Update map to show all photos from this day
            updateMapForDay(dayNumber, dayPhotos);

            // Update progress counter
            const totalDays = getTotalDays();
            document.getElementById('slideshow-current').textContent = dayNumber;
            document.getElementById('slideshow-total').textContent = totalDays;
        }

        // Store GPX layer for day view
        let dayGPXLayer = null;

        // Update map to show all photos from a specific day
        function updateMapForDay(dayNumber, dayPhotos) {
            if (!slideshowMap) return;

            // Close all popups
            slideshowCampingMarkers.forEach(marker => {
                marker.closePopup();
            });

            // Remove old photo markers
            dayPhotoMarkers.forEach(marker => {
                slideshowMap.removeLayer(marker);
            });
            dayPhotoMarkers = [];

            // Remove single photo marker if exists
            if (slideshowMarker) {
                slideshowMap.removeLayer(slideshowMarker);
                slideshowMarker = null;
            }

            // Remove old GPX layer if exists
            if (dayGPXLayer) {
                slideshowMap.removeLayer(dayGPXLayer);
                dayGPXLayer = null;
            }

            // Add markers for all photos in this day
            const boundsPoints = [];
            dayPhotos.forEach((photo, index) => {
                const lat = parseFloat(photo.latitude);
                const lon = parseFloat(photo.longitude);
                boundsPoints.push([lat, lon]);

                const marker = L.circleMarker([lat, lon], {
                    radius: 8,
                    fillColor: '#f39c12',
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8,
                    pane: 'photoPane'
                }).addTo(slideshowMap);

                const photoDate = new Date(photo.dateTaken);
                marker.bindPopup(`
                    <div style="min-width: 150px;">
                        <p style="margin: 5px 0;"><strong>Photo ${index + 1}</strong></p>
                        <p style="margin: 5px 0;">${photoDate.toLocaleTimeString()}</p>
                    </div>
                `);

                dayPhotoMarkers.push(marker);
            });

            // Add camping locations for current and previous day
            const currentDayCamping = findCampingByDay(dayNumber);
            const previousDayCamping = findCampingByDay(dayNumber - 1);

            if (currentDayCamping) {
                boundsPoints.push([currentDayCamping.latitude, currentDayCamping.longitude]);
            }
            if (previousDayCamping) {
                boundsPoints.push([previousDayCamping.latitude, previousDayCamping.longitude]);
            }

            // Load GPX track for this day and fit bounds after loading
            loadGPXForDay(dayNumber, boundsPoints).then(() => {
                // Fit map to show all points (including GPX track points)
                if (boundsPoints.length > 0) {
                    const bounds = L.latLngBounds(boundsPoints);
                    slideshowMap.fitBounds(bounds, {
                        padding: [50, 50],
                        maxZoom: 14
                    });
                }
            });

            setTimeout(() => {
                slideshowMap.invalidateSize();
            }, 100);
        }

        // Load GPX track for a specific day
        async function loadGPXForDay(dayNumber, boundsPoints) {
            try {
                // Get the date for this day
                const dayPhotos = getPhotosForDay(dayNumber);
                if (dayPhotos.length === 0) return;

                // Extract date from first photo (format: 2025-04-29T...)
                const firstPhotoDate = new Date(dayPhotos[0].dateTaken);
                const dateStr = firstPhotoDate.toISOString().split('T')[0]; // Gets YYYY-MM-DD

                // Load GPX index
                const indexResponse = await fetch('inputs/map_overlay_metadata/gpx/index.json');
                const gpxFiles = await indexResponse.json();

                // Find GPX files for this date
                const dayGPXFiles = gpxFiles.filter(filename => filename.startsWith(dateStr));

                console.log(`Found ${dayGPXFiles.length} GPX files for day ${dayNumber} (${dateStr})`);

                if (dayGPXFiles.length === 0) return;

                const parser = new DOMParser();

                // Load and display each GPX file for this day
                for (const filename of dayGPXFiles) {
                    const gpxPath = `inputs/map_overlay_metadata/gpx/${filename}`;

                    try {
                        const gpxResponse = await fetch(gpxPath);
                        const gpxText = await gpxResponse.text();

                        // Parse GPX
                        const gpxDoc = parser.parseFromString(gpxText, 'text/xml');
                        const trackPoints = gpxDoc.querySelectorAll('trkpt');

                        if (trackPoints.length > 0) {
                            const coordinates = Array.from(trackPoints).map(pt => {
                                const lat = parseFloat(pt.getAttribute('lat'));
                                const lon = parseFloat(pt.getAttribute('lon'));
                                boundsPoints.push([lat, lon]);
                                return [lat, lon];
                            });

                            // Create polyline for this GPX track
                            const track = L.polyline(coordinates, {
                                color: '#FF00FF',
                                weight: 5,
                                opacity: 0.8,
                                smoothFactor: 1
                            }).addTo(slideshowMap);

                            track.bindPopup(`<b>Hiking Track</b><br>Date: ${dateStr}<br>Points: ${coordinates.length}`);

                            // Store the layer so we can remove it later
                            if (!dayGPXLayer) {
                                dayGPXLayer = L.layerGroup([track]).addTo(slideshowMap);
                            } else {
                                dayGPXLayer.addLayer(track);
                            }
                        }
                    } catch (err) {
                        console.warn(`Failed to load GPX file ${filename}:`, err);
                    }
                }
            } catch (error) {
                console.error('Error loading GPX for day:', error);
            }
        }

        // Update map to highlight a specific photo (when clicked in day view)
        function updateMapForPhoto(photoIndex) {
            const photo = slideshowPhotos[photoIndex];
            const lat = parseFloat(photo.latitude);
            const lon = parseFloat(photo.longitude);

            // Center map on this photo
            if (slideshowMap) {
                slideshowMap.setView([lat, lon], 15);
            }
        }

        function startAutoPlay() {
            isPlaying = true;
            document.getElementById('top-play-pause-btn').textContent = '⏸ Pause';
            slideshowInterval = setInterval(() => {
                showSlide(currentSlideIndex + 1);
            }, 3000); // 3 seconds per photo
        }

        function stopAutoPlay() {
            isPlaying = false;
            document.getElementById('top-play-pause-btn').textContent = '▶ Play';
            if (slideshowInterval) {
                clearInterval(slideshowInterval);
                slideshowInterval = null;
            }
        }

        // Event listeners
        document.getElementById('prev-btn').addEventListener('click', function() {
            stopAutoPlay();
            if (isDayView) {
                // Navigate to previous day
                if (currentDayNumber > 1) {
                    showDayView(currentDayNumber - 1);
                }
            } else {
                showSlide(currentSlideIndex - 1);
            }
        });

        document.getElementById('next-btn').addEventListener('click', function() {
            stopAutoPlay();
            if (isDayView) {
                // Navigate to next day
                const totalDays = getTotalDays();
                if (currentDayNumber < totalDays) {
                    showDayView(currentDayNumber + 1);
                }
            } else {
                showSlide(currentSlideIndex + 1);
            }
        });

        document.getElementById('top-play-pause-btn').addEventListener('click', function() {
            if (isPlaying) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        });

        document.getElementById('toggle-view-btn').addEventListener('click', function() {
            toggleView();
        });

        document.getElementById('close-slideshow-btn').addEventListener('click', function() {
            window.location.href = 'index.html';
        });

        // Keyboard controls
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                stopAutoPlay();
                if (isDayView) {
                    if (currentDayNumber > 1) {
                        showDayView(currentDayNumber - 1);
                    }
                } else {
                    showSlide(currentSlideIndex - 1);
                }
            } else if (e.key === 'ArrowRight') {
                stopAutoPlay();
                if (isDayView) {
                    const totalDays = getTotalDays();
                    if (currentDayNumber < totalDays) {
                        showDayView(currentDayNumber + 1);
                    }
                } else {
                    showSlide(currentSlideIndex + 1);
                }
            } else if (e.key === ' ') {
                e.preventDefault();
                if (!isDayView) {
                    if (isPlaying) {
                        stopAutoPlay();
                    } else {
                        startAutoPlay();
                    }
                }
            } else if (e.key === 'Escape') {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
